server.port=9082
spring.application.name=api-metier

# Database (H2 for Dev)
# Fichier sur disque => la donnée survit au redémarrage du backend (et au F5).
# AUTO_SERVER permet plusieurs connexions (console H2 + app) sans verrou.
spring.datasource.url=jdbc:h2:file:./data/metier-db;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver

# Erreurs : exposer le message des ResponseStatusException dans le corps JSON (champ "message").
# Sans ça, les garde-fous métier (409 email déjà pris, 422 mairie en double, 403 hors périmètre…)
# arrivent au front avec un message vide → « Échec » générique. Ici on veut le vrai motif affiché.
server.error.include-message=always

# JPA
# update : crée le schéma au 1er démarrage puis le fait évoluer sans effacer les données.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Upload de preuves terrain (photos d'intervention) — au-delà du défaut 1 Mo.
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=12MB

# Réconciliation au démarrage : matérialise (silencieusement) les alertes manquantes des actifs
# OFFICIELS déjà POLLUÉS / MENACÉS / EN PANNE. Idempotent (dédup), sans fan-out. Mettre à false
# en production à grande échelle si l'on ne veut pas matérialiser tout l'historique d'un coup.
gestidlo.backfill.critical-alerts=true

# Thresholds (MVP)
gestidlo.threshold.pressure.minWarn=2.0
gestidlo.threshold.pressure.minCrit=1.0
gestidlo.threshold.level.minCrit=10.0

# Camunda API
gestidlo.camunda-api.url=http://localhost:9081

# JWT (dev)
# Must be at least 32 bytes for HS256.
gestidlo.jwt.secret=${GESTIDLO_JWT_SECRET:change-me-please-change-me-please-change-me-32bytes}
