server.port=9083
spring.application.name=bff

gestidlo.api-metier.url=http://localhost:9082
gestidlo.camunda-api.url=http://localhost:9081

# Exposer le message d'erreur (motif du garde-fou métier remonté depuis api-metier) dans le
# corps JSON du BFF → le front peut afficher le vrai message au lieu d'un « Échec » générique.
server.error.include-message=always

# JWT (dev)
gestidlo.jwt.secret=${GESTIDLO_JWT_SECRET:change-me-please-change-me-please-change-me-32bytes}

# CORS (SPA)
gestidlo.spa.origin=http://localhost:4200
