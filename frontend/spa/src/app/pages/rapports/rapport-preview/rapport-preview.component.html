<div class="rp-overlay" (click)="fermer.emit()">
  <div class="rp-wrapper" (click)="$event.stopPropagation()">

    <!-- Toolbar -->
    <div class="rp-toolbar">
      <span class="rp-toolbar__title">Aperçu — {{ rapport.title }}</span>
      <div class="rp-toolbar__actions">
        <button class="rp-tb-btn" type="button" (click)="imprimer()">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <polyline points="6 9 6 2 18 2 18 9"/>
            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
            <rect x="6" y="14" width="12" height="8"/>
          </svg>
          Imprimer
        </button>
        <button class="rp-tb-btn rp-tb-btn--close" type="button" (click)="fermer.emit()">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
          Fermer
        </button>
      </div>
    </div>

    <!-- A4 page scroll area -->
    <div class="rp-scroll">
      <div class="rp-page-shadow">

        <app-inspection-template
          *ngIf="template === 'inspection'"
          [rapport]="rapport">
        </app-inspection-template>

        <app-mensuel-template
          *ngIf="template === 'mensuel'"
          [rapport]="rapport">
        </app-mensuel-template>

        <app-incident-grave-template
          *ngIf="template === 'incident_grave'"
          [rapport]="rapport">
        </app-incident-grave-template>

        <app-audit-template
          *ngIf="template === 'audit'"
          [rapport]="rapport">
        </app-audit-template>

      </div>
    </div>

  </div>
</div>
