server {
  listen 80;

  root /usr/share/nginx/html;
  index index.html;

  # Assets hashés par le build (chunk-*.js, *.css, polices, images) : le nom CHANGE à chaque
  # modif → on peut les mettre en cache « pour toujours » sans risque de servir du périmé.
  location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|webp|ico)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html + toutes les routes SPA : JAMAIS caché. Ainsi, après un rebuild du conteneur,
  # un simple reload récupère l'index à jour qui référence les nouveaux chunks hashés →
  # plus de « error loading dynamically imported module / chunk-XXXX.js » (chunk périmé).
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store, must-revalidate";
  }
}
